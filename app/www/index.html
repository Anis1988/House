<!doctype html>
<html lang="en" data-side="lights">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>House</title>
<script>
  // Theme and last device before first paint, so there's no flash
  (function () {
    var pref, side; try { pref = localStorage.getItem("theme"); side = localStorage.getItem("house.side"); } catch (e) {}
    var light = pref === "light" || (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.dataset.theme = light ? "light" : "dark";
    if (side) document.documentElement.dataset.side = side;
  })();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="aurora" id="aurora"><i></i><i></i><i></i></div>
<div class="grid-floor"></div>

<div class="app">
  <header>
    <div class="logo" id="sideLogo"></div>
    <div class="switch" id="switch" role="tablist" aria-label="Devices"></div>
    <button class="round-btn glass" id="guideBtn" aria-label="Guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.3M12 17h.01"/></svg></button>
  </header>

  <div class="update glass" id="updBanner">
    <div class="upd-icon"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></div>
    <div class="upd-text"><b>Update available</b><span id="updVer"></span></div>
    <button class="upd-go" id="updGo">Download</button>
    <button class="upd-x" id="updX" aria-label="Dismiss"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="pages" id="pages"></div>
</div>

<div class="nav-scrim"></div>
<nav class="glass" id="nav"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast glass" id="toast"></div>

<script src="capacitor.js"></script>
<script src="js/core.js"></script>
<script src="js/home.js"></script>
<script src="js/lights.js"></script>
<script src="js/tv.js"></script>
<script src="js/screen.js"></script>
<script src="js/nest.js"></script>
<script src="js/cams.js"></script>
<script src="js/wifi.js"></script>
<script>House.start();</script>
</body>
</html>
